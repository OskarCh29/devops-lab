services:
  redis:
    image: redis:8.8.4
    container_name: DevopsLab-redis
    ports:
      - "6379:6379"
    cpus: 0.25
    mem_limit: 256m
  ministack:
    image: ministackorg/ministack
    ports:
      - "4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - REDIS_HOST=redis
